services:
  postgres:
    image: postgres:16

    container_name: meetflow-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: meetflow
      POSTGRES_PASSWORD: meetflow123
      POSTGRES_DB: meetflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: